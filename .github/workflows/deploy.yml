# Jeder Merge auf main landet automatisch auf dem Hetzner-Server:
# Image bei GitHub bauen → in die GitHub Container Registry → Server holt es.
# Von Hand anstoßen: GitHub → Actions → „Deployment (Hetzner)" → Run workflow.
#
# Braucht im Repo (Settings → Secrets and variables → Actions):
#   Secret   SERVER_SSH_KEY      privater Schlüssel des Nutzers deploy
#   Variable SERVER_HOST         IP des Servers
#   Variable SERVER_KNOWN_HOSTS  Fingerabdruck des Servers (ssh-keyscan)

name: Deployment (Hetzner)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deployment

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/luis-rong/termin-papagei

jobs:
  ausliefern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Auf dem Server starten
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS }}
          HOST: ${{ vars.SERVER_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy
          ziel="deploy@$HOST"
          ssh_opt="-i $HOME/.ssh/deploy"

          scp $ssh_opt deploy/docker-compose.yml deploy/Caddyfile "$ziel:/opt/termin-papagei/"

          # Der GITHUB_TOKEN gilt nur während dieses Laufs — der Server
          # bekommt ihn kurz zum Herunterladen und meldet sich danach ab.
          printf '%s' "$TOKEN" | ssh $ssh_opt "$ziel" "
            set -e
            cd /opt/termin-papagei
            docker login ghcr.io -u '$ACTOR' --password-stdin
            docker compose pull app
            docker compose up -d
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker logout ghcr.io
            docker image prune -f
          "
